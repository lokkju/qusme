name: deploy

# Deploys the Worker (packages/entry-worker) to the `qusme` script, which serves
# app.qus.me. Runs on every push to main that touches the Worker's code, its
# migrations or its build inputs, and by hand. lokkju/infra's Pulumi stack owns
# the script's custom domain (app.qus.me), the D1 database, the deploy token and
# the Worker's secrets; this workflow applies pending D1 migrations and then
# uploads the code. Deploys keep the secrets Pulumi set.

on:
  push:
    branches: [main]
    paths:
      - packages/core/**
      - packages/nostr/**
      - packages/store-sql/**
      - packages/entry-worker/**
      - registry/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .mise/config.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits rather than cancelling a deploy
# that may be between its migration and its upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: homelab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.18

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Apply D1 migrations
        working-directory: packages/entry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote

      # /healthz reports the commit until CalVer release tags exist.
      - name: Deploy
        working-directory: packages/entry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version="${GITHUB_SHA::7}"
          pnpm exec wrangler deploy --define "__QUSME_VERSION__:\"$version\""
