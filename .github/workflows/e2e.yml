name: e2e

# Browser end-to-end tests (e2e/): the built Chrome extension in headless Chromium against the
# harness's local service and relays. On GitHub-hosted runners, like ci.yml: the repo is public.

on:
  pull_request:
    paths:
      - packages/extension/**
      - packages/nostr/**
      - packages/core/**
      - packages/store-sql/**
      - e2e/**
      - registry/snapshot.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .mise/config.toml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - packages/extension/**
      - packages/nostr/**
      - packages/core/**
      - packages/store-sql/**
      - e2e/**
      - registry/snapshot.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .mise/config.toml
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node and pnpm at the versions pinned in .mise/config.toml
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.18

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm -C e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C e2e exec playwright install --with-deps --no-shell chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C e2e exec playwright install-deps chromium

      - name: Build the extension
        run: pnpm -C packages/extension exec wxt build

      - name: Test
        run: pnpm -C e2e test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
