name: image

# Builds packages/entry-node's Dockerfile on the homelab-build runner (rootless
# BuildKit) and, on main or by hand, pushes it to zot as
# registry.lab.lokkju.com/builds/qusme, tagged with the full and the short
# commit SHA. lokkju/infra's `build_repos` provides the REGISTRY_HOST,
# REGISTRY_USER and REGISTRY_PASSWORD secrets and lokkju/infra deploys the
# image (lokkju/infra#660). Never ghcr.io.
#
# Pull requests build without pushing, so a broken Dockerfile fails the PR.

on:
  pull_request:
    paths:
      - packages/core/**
      - packages/nostr/**
      - packages/store-sql/**
      - packages/entry-node/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/image.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: homelab-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tags
        id: v
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      # Pull requests log in too, to read the build cache.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/entry-node/Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            QUSME_VERSION=${{ steps.v.outputs.short }}
          tags: |
            ${{ secrets.REGISTRY_HOST }}/builds/qusme:${{ github.sha }}
            ${{ secrets.REGISTRY_HOST }}/builds/qusme:${{ steps.v.outputs.short }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_HOST }}/cache/qusme
          # Only pushes write the cache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/cache/qusme,mode=max,image-manifest=true,oci-mediatypes=true', secrets.REGISTRY_HOST) || '' }}

      - name: Summary
        if: github.event_name != 'pull_request'
        # REGISTRY_HOST is a secret, so the runner would mask it here; the
        # summary spells the host out.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHORT: ${{ steps.v.outputs.short }}
        run: |
          {
            echo "### registry.lab.lokkju.com/builds/qusme"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`${GITHUB_SHA}\`, \`${SHORT}\` |"
            echo "| Pin | \`registry.lab.lokkju.com/builds/qusme:${SHORT}@${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
