name: release-extension

# Releases the browser extension (packages/extension): computes the CalVer
# version, builds and zips Chrome and Firefox, submits them to the Chrome Web
# Store and Firefox Add-ons with `wxt submit`, and publishes a GitHub release
# `extension-v<version>` with the zips. A Chrome Web Store that is still
# reviewing an earlier version is a warning, not a failure. It runs on every push to main that
# changes what ships in the extension, and by hand. Either way the `release`
# job waits for lokkju's approval on the `release` environment, which admits
# main only. A newer run cancels an older one still waiting for approval; an
# approved release is never cancelled. The version is written into
# package.json inside the job and never committed back.
# packages/extension/README.md, "Releasing".

on:
  push:
    branches: [main]
    # What ships in the extension: its own sources, the one workspace package
    # it bundles (@qusme/nostr; @qusme/core and @qusme/store-sql are test-only
    # devDependencies), the registry snapshot it bundles, the toolchain and
    # lockfile, and this workflow. Tests, scripts and Markdown don't ship.
    # Keep in step with SHIP_PATHSPEC in the plan job.
    paths:
      - packages/extension/**
      - packages/nostr/**
      - registry/snapshot.json
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - .npmrc
      - tsconfig.base.json
      - .mise/config.toml
      - .github/workflows/release-extension.yml
      - "!packages/extension/test/**"
      - "!packages/nostr/test/**"
      - "!packages/nostr/scripts/**"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check store credentials with `wxt submit --dry-run`; upload nothing, make no release
        type: boolean
        default: false

permissions: {}

jobs:
  # Runs before the approval gate: cancels older runs that haven't started
  # releasing, and lists the commits this run would ship in its summary, so
  # the approver sees what they're approving.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Workflow-level concurrency can't do this: a job waiting for approval
      # holds its concurrency group like a running one, so cancel-in-progress
      # would also kill an approved release in the middle of `wxt submit`, and
      # without it the old waiting run keeps the group. A run whose release
      # job is running or done is left alone; anything earlier (queued,
      # planning, waiting for approval, pending) is cancelled.
      - name: Cancel older runs waiting for approval
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          older=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-extension.yml --limit 100 \
            --json databaseId,number,status \
            --jq ".[] | select(.status != \"completed\" and .number < $GITHUB_RUN_NUMBER) | .databaseId")
          for id in $older; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "release") | .status][0] // "none"')
            case "$state" in
              in_progress | completed)
                echo "Run $id is releasing ($state); leaving it" ;;
              *)
                echo "::notice::Cancelling run $id (release job: $state); this run replaces it"
                gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel run $id" ;;
            esac
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Summarize what would ship
        env:
          # on.push.paths as a git pathspec
          SHIP_PATHSPEC: >-
            packages/extension packages/nostr registry/snapshot.json
            pnpm-lock.yaml package.json pnpm-workspace.yaml .npmrc
            tsconfig.base.json .mise/config.toml
            .github/workflows/release-extension.yml
            :(exclude)packages/extension/test :(exclude)packages/nostr/test
            :(exclude)packages/nostr/scripts :(exclude,glob)**/*.md
        run: |
          set -euo pipefail
          read -ra pathspec <<<"$SHIP_PATHSPEC"
          last=$(git tag --list 'extension-v*' --sort=-v:refname | head -n 1)
          short=$(git rev-parse --short HEAD)
          {
            echo "### Extension release from $short"
            echo
            if [ -n "$last" ]; then
              range="$last..HEAD"
              echo "Last release: \`$last\`. Commits since then that change what ships:"
            else
              range=HEAD
              echo "No \`extension-v*\` release yet. Commits that change what ships:"
            fi
            echo
            total=$(git rev-list --count --no-merges "$range" -- "${pathspec[@]}")
            if [ "$total" -eq 0 ]; then
              echo "None."
            else
              git log --no-merges --max-count=50 --format='- %h %s (%an)' "$range" -- "${pathspec[@]}"
              if [ "$total" -gt 50 ]; then
                echo "- and $((total - 50)) more"
              fi
            fi
            echo
            if [ -n "$last" ]; then
              echo "[Full diff]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA)"
              echo
            fi
            echo "The version is picked after approval: today's UTC date, with a suffix if that date is taken."
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    runs-on: ubuntu-24.04
    environment: release
    # One release at a time, so two can't pick the same version. A newer run
    # waits here (pending) until the running one finishes; older waiting runs
    # are cancelled by the plan job.
    concurrency:
      group: release-extension
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
    steps:
      - name: Refuse a ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main only, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node and pnpm at the versions pinned in .mise/config.toml
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.18

      # Today's UTC date as YYYY.M.D, then .1, .2 and so on past any release or
      # tag that already has it. Draft releases count, so a run whose
      # submission failed leaves its version taken.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          current=$(jq -r .version packages/extension/package.json)
          base=$(date -u +%Y.%-m.%-d)
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/extension-v" --jq '.[].ref | ltrimstr("refs/tags/")')
          taken=$(printf '%s\n%s\n' "$releases" "$tags")
          version=$base
          n=0
          while grep -qxF "extension-v$version" <<<"$taken"; do
            n=$((n + 1))
            version="$base.$n"
          done
          highest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
          if [ "$version" = "$current" ] || [ "$highest" != "$version" ]; then
            echo "::error::Version $version is not greater than package.json's $current"
            exit 1
          fi
          echo "Releasing $version (package.json has $current)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          file=packages/extension/package.json
          jq --arg v "$VERSION" '.version = $v' "$file" >"$file.tmp"
          mv "$file.tmp" "$file"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter "@qusme/extension..." run typecheck

      - name: Test
        run: pnpm exec vitest run --project @qusme/extension --project @qusme/nostr

      - name: Zip
        id: zip
        working-directory: packages/extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec wxt zip
          pnpm exec wxt zip -b firefox
          dir="$PWD/.output"
          for kind in chrome firefox sources; do
            zip="$dir/qusme-$VERSION-$kind.zip"
            test -f "$zip" || { echo "::error::Missing $zip"; exit 1; }
            echo "$kind=$zip" >>"$GITHUB_OUTPUT"
          done

      # A draft first, so the zips are attached before any store sees them.
      # It is published once every store is submitted, skipped or busy.
      - name: Create draft release
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHROME_ZIP_PATH: ${{ steps.zip.outputs.chrome }}
          FIREFOX_ZIP_PATH: ${{ steps.zip.outputs.firefox }}
          SOURCES_ZIP_PATH: ${{ steps.zip.outputs.sources }}
        run: |
          set -euo pipefail
          gh release create "extension-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Extension $VERSION" \
            --notes "Browser extension $VERSION, built from $GITHUB_SHA." \
            "$CHROME_ZIP_PATH" "$FIREFOX_ZIP_PATH" "$SOURCES_ZIP_PATH"

      # Each store is submitted on its own `wxt submit`, so one store's result
      # can't hide another's. A store whose secrets aren't all set is skipped
      # with a notice. Chrome reviews one version at a time and answers
      # NOT_UPDATEABLE ("You may not edit or publish an item that is in
      # review") while an earlier version is still in review; that is "busy",
      # a warning, and the release is still published. Any other failure
      # fails the step. Chrome uses the Web Store API v2 with a service
      # account; v1.1 (client id, secret and refresh token) shut down on
      # 2026-10-15.
      - name: Submit to stores
        working-directory: packages/extension
        env:
          CHROME_ZIP_PATH: ${{ steps.zip.outputs.chrome }}
          FIREFOX_ZIP_PATH: ${{ steps.zip.outputs.firefox }}
          SOURCES_ZIP_PATH: ${{ steps.zip.outputs.sources }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          missing() {
            local out=() name
            for name in "$@"; do
              [ -n "${!name}" ] || out+=("$name")
            done
            echo "${out[*]}"
          }
          dry=()
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            dry=(--dry-run)
          fi
          logs=$(mktemp -d)
          results=()
          attempted=0
          failed=0
          # submit <key> <store name> <secret names, space separated> <wxt submit flags...>
          submit() {
            local key=$1 name=$2 secrets=$3 gaps log status
            shift 3
            # shellcheck disable=SC2086 # the secret names are one word each
            gaps=$(missing $secrets)
            if [ -n "$gaps" ]; then
              echo "::notice::Skipping $name: unset $gaps"
              results+=("$name: skipped (unset $gaps)")
              return
            fi
            attempted=$((attempted + 1))
            log="$logs/$key.log"
            echo "::group::Submitting to $name"
            set +e
            pnpm exec wxt submit "$@" "${dry[@]}" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              results+=("$name: submitted")
            elif [ "$key" = chrome ] && grep -qE 'NOT_UPDATEABLE|item that is in review' "$log"; then
              echo "::warning::$name is busy: an earlier version is still in review, so this version was not submitted there. The next release submits it again; to ship this one sooner, upload its Chrome zip from the GitHub release in the developer dashboard once that review finishes."
              results+=("$name: busy (an earlier version is in review)")
            else
              echo "::error::$name submission failed (exit $status); its output is in the \"Submitting to $name\" group above"
              results+=("$name: failed (exit $status)")
              failed=$((failed + 1))
            fi
          }
          submit chrome "Chrome Web Store" \
            "CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" \
            --chrome-zip "$CHROME_ZIP_PATH"
          submit firefox "Firefox Add-ons" \
            "FIREFOX_EXTENSION_ID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET" \
            --firefox-zip "$FIREFOX_ZIP_PATH" --firefox-sources-zip "$SOURCES_ZIP_PATH"
          {
            if [ "${#dry[@]}" -gt 0 ]; then
              echo "### Store submissions (dry run)"
            else
              echo "### Store submissions"
            fi
            echo
            printf -- '- %s\n' "${results[@]}"
          } >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${results[@]}"
          if [ "$attempted" -eq 0 ]; then
            echo "::error::No store has all of its secrets set; nothing to submit"
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

      - name: Publish release
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "extension-v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
