<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compose post</title>
<style>
  /* A neutral demo compose page for the store screenshots. It imitates no real site. */
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; background: #eef0f3; color: #1d2330; }
  .top { height: 52px; background: #ffffff; border-bottom: 1px solid #dde1e7; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #c9ced8; }
  .bar { height: 10px; border-radius: 5px; background: #dde1e7; }
  .layout { display: grid; grid-template-columns: 170px 1fr; gap: 24px; padding: 24px; }
  .side { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
  .side .bar { width: 120px; }
  .side .bar:nth-child(2n) { width: 90px; }
  .card { background: #ffffff; border: 1px solid #dde1e7; border-radius: 14px; padding: 18px 20px; max-width: 560px; }
  .card h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .row { display: flex; gap: 12px; }
  textarea { flex: 1; min-height: 120px; resize: none; border: 1px solid #c9ced8; border-radius: 10px; padding: 12px; font: inherit; font-size: 15px; color: inherit; outline: none; }
  textarea:focus { border-color: #6b7a99; box-shadow: 0 0 0 3px rgba(107,122,153,.18); }
  .foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .tool { width: 22px; height: 22px; border-radius: 6px; background: #e3e6ec; }
  .count { margin-left: auto; font-size: 12px; color: #6b7280; }
  button { border: 0; border-radius: 999px; background: #3b4a66; color: #fff; font: inherit; font-weight: 600; font-size: 14px; padding: 8px 18px; }
  .feed { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
  .post { background: #ffffff; border: 1px solid #dde1e7; border-radius: 14px; padding: 16px 20px; display: flex; gap: 12px; }
  .post .lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
</style>
</head>
<body>
  <div class="top"><div class="dot"></div><div class="bar" style="width:140px"></div></div>
  <div class="layout">
    <nav class="side"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></nav>
    <main>
      <section class="card">
        <h1>Compose post</h1>
        <div class="row">
          <div class="dot" style="width:38px;height:38px"></div>
          <textarea id="compose" aria-label="Post text" placeholder="Write something…"></textarea>
        </div>
        <div class="foot"><div class="tool"></div><div class="tool"></div><div class="tool"></div><span class="count">0 / 280</span><button type="button">Post</button></div>
      </section>
      <div class="feed">
        <div class="post"><div class="dot" style="width:38px;height:38px"></div><div class="lines"><div class="bar" style="width:40%"></div><div class="bar" style="width:92%"></div><div class="bar" style="width:76%"></div></div></div>
        <div class="post"><div class="dot" style="width:38px;height:38px"></div><div class="lines"><div class="bar" style="width:32%"></div><div class="bar" style="width:88%"></div><div class="bar" style="width:60%"></div></div></div>
        <div class="post"><div class="dot" style="width:38px;height:38px"></div><div class="lines"><div class="bar" style="width:46%"></div><div class="bar" style="width:84%"></div></div></div>
      </div>
    </main>
  </div>
</body>
</html>
